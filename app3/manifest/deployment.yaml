apiVersion: apps/v1
kind: Deployment
metadata:
  name: html
  labels:
    app: html
spec:
  replicas: 1
  selector:
    matchLabels:
      app: html
  template:
    metadata:
      labels:
        app: html
    spec:
      containers:
        - name: html
          image: html:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
